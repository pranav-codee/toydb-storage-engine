# toydb.conf: every tunable of the toyDB experiments.
# Format: key = value, one per line. '#' starts a comment. A missing key
# falls back to the default built into the program, and "key=value" on a
# program's command line overrides this file.

# General
buffer_pool_size    = 50
default_policy      = LRU          # LRU | MRU
data_file           = ../data/student.txt
work_dir            = /tmp/toydb_run
seed                = 42

# Part 1: buffer manager benchmark
buf_file_pages      = 1000
buf_queries         = 10000
# 900 close to buf_file_pages, 1200 larger
buf_pool_sizes      = 20,50,100,900,1200
buf_read_pcts       = 100,90,75,50,25,10,0
buf_patterns        = uniform,hotcold,sequential
hot_fraction        = 0.2
hot_prob            = 0.8
# pool size for the read/write-mix plots and the summary table (make plots)
plot_pool           = 100
# read percentage for the summary table (make plots)
plot_read_pct       = 50

# Part 2: slotted vs static heap file space
static_lengths      = 100,104,110,128,160,200,256
churn_fraction      = 0.3

# Part 3: B+ tree build methods
bulk_fill_factor    = 1.0
idx_point_queries   = 1000
idx_missing_queries = 100
idx_range_queries   = 200
idx_range_len       = 100
repeats             = 5
